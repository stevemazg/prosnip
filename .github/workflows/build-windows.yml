name: Build ProSnip-Bob

on:
  push:
    branches:
      - prosnip-bob
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Smoke import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv\Scripts\python.exe -c "import sys; sys.path.insert(0, 'src'); import capture, editor, canvas, items, toolbar, stamp_picker, styles, hotkey, instance, main_window, window_list, recorder, main"

      - name: Build executable
        run: |
          $env:Path = "$PWD\.venv\Scripts;$env:Path"
          pyinstaller --noconfirm --clean --onedir --windowed --noupx --name ProSnip-Bob --exclude-module tkinter --collect-data imageio_ffmpeg --version-file version_info.txt src/main.py

      - name: Zip application folder
        run: |
          if (-not (Test-Path dist\ProSnip-Bob\ProSnip-Bob.exe)) { throw "ProSnip-Bob.exe was not produced" }
          if (-not (Test-Path dist\ProSnip-Bob\_internal)) { throw "The _internal folder is missing" }
          if (Test-Path dist\ProSnip-Bob.zip) { Remove-Item dist\ProSnip-Bob.zip }
          Compress-Archive -Path dist\ProSnip-Bob -DestinationPath dist\ProSnip-Bob.zip

      - name: Upload ProSnip-Bob.zip
        uses: actions/upload-artifact@v4
        with:
          name: ProSnip-Bob
          path: dist/ProSnip-Bob.zip
          if-no-files-found: error
